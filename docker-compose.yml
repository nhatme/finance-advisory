# ─────────────────────────────────────────────────────────────────
#  docker-compose.yml  —  CPU (default)
#
#  Usage:
#    docker compose up --build
#
#  Config source of truth:
#    - App config + secrets (LLM_PROVIDER, API keys, models, CORS) → backend/.env
#      (read by the api container via env_file below; falls back to safe code
#       defaults if backend/.env is absent — the app still runs in stub mode).
#    - This file holds ONLY orchestration: ports, volumes, service wiring, and
#      the container-path overrides that genuinely must differ from dev.
# ─────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uit-lab-api
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Container-path overrides only — pin data to the mounted volume.
      # Everything else (LLM, keys, CORS, models) comes from backend/.env.
      DATABASE_URL: sqlite:////app/data/app.db
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: uit-lab-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
