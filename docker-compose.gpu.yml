# ─────────────────────────────────────────────────────────────────
#  docker-compose.gpu.yml  —  GPU OVERRIDE (layer on top of the base file)
#
#  This is NOT a standalone file. It contains ONLY the GPU-specific deltas;
#  everything else is inherited from docker-compose.yml so there is a single
#  source of truth and no duplicated config to keep in sync.
#
#  Requirements on the host:
#    - NVIDIA GPU with driver >= 525
#    - NVIDIA Container Toolkit
#      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
#  Usage (note BOTH -f flags, base first):
#    docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#    docker compose -f docker-compose.yml -f docker-compose.gpu.yml down
#
#  What it changes vs CPU:
#    - Backend builds with TORCH_VARIANT=gpu  (CUDA 12.1 PyTorch, ~2 GB)
#    - EMBEDDING_DEVICE=cuda  (sentence-transformers on GPU)
#    - Adds an Ollama service with NVIDIA passthrough; api talks to it over
#      the docker network at http://ollama:11434
#  App config (LLM_PROVIDER, API keys, models, CORS) still lives in backend/.env.
# ─────────────────────────────────────────────────────────────────

services:
  api:
    build:
      args:
        TORCH_VARIANT: gpu          # CUDA 12.1 PyTorch wheel (~2 GB)
    environment:
      # GPU/orchestration deltas only — merged onto the base environment.
      EMBEDDING_DEVICE: cuda        # run sentence-transformers on GPU
      OLLAMA_HOST: http://ollama:11434   # reach the ollama service over docker network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      start_period: 60s             # GPU torch init takes longer to warm up
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: uit-lab-ollama
    # No host port binding — the api container reaches Ollama via the docker
    # network (http://ollama:11434). To call it from the host, add:
    #   ports: ["11435:11434"]   (11435 avoids clashing with a local Ollama)
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
